name: Deploy website to GitHub Pages

# Manual only. The website needs a deployed API: set the repository variable
# VITE_API_BASE_URL (Settings > Secrets and variables > Actions > Variables),
# e.g. https://api.dailydrop.today/api, before running this.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require API URL
        run: |
          if [ -z "${{ vars.VITE_API_BASE_URL }}" ]; then
            echo "::error::Set the VITE_API_BASE_URL repository variable to the deployed API URL first."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
