# One-click hosting on Render (https://render.com): Dashboard > New > Blueprint > pick this repo.
# Render asks for every value marked "sync: false". MongoDB itself is not created here:
# use MongoDB Atlas and paste its connection string into MONGODB_URI.
services:
  - type: web
    name: dailydrop-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: REQUIRE_ADMIN_2FA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: APP_URL # e.g. https://dailydrop-web.onrender.com or your own domain
        sync: false
      - key: CORS_ORIGINS # same as APP_URL
        sync: false
      - key: SELLER_ABN
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
      - key: PAYMENT_BANK_NAME
        sync: false
      - key: PAYMENT_BSB
        sync: false
      - key: PAYMENT_ACCOUNT_NUMBER
        sync: false
      - key: PAYMENT_PAYID
        sync: false
      - key: SMTP_URL # e.g. smtps://user:pass@smtp.postmarkapp.com:465
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: dailydrop-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL # e.g. https://dailydrop-api.onrender.com/api
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
